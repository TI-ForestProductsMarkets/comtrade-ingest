# Comtrade Ingest config
# Docs: https://comtradedeveloper.un.org/api-details
# Subscription plans: https://uncomtrade.org/docs/subscriptions/

# IMPORTANT:
# Store your API key in .env like this:
# COMTRADE_API_KEY=your_key_here

# Token tips:
# - cmdCode can use token names from src/comtrade_ingest/reference/hs_sets.py
# - flowCode can use token names from src/comtrade_ingest/reference/flow_sets.py


# -------------------------------------------
# PATHS
# -------------------------------------------
# NOTE: Change the `root_dir` to your desired location. 

paths:
  root_dir: "/storage/test"

  data_dir: "{root_dir}/data"
  single_data_dir: "{data_dir}/single"
  bulk_data_dir: "{data_dir}/bulk"

  output_dir: "{root_dir}/output"
  logs_dir: "{output_dir}/logs"
  manifest_dir: "{output_dir}/manifest"
  reports_dir: "{output_dir}/reports"
  quarantine_dir: "{reports_dir}/_quarantine"

# -------------------------------------------
# Single DATA API DOWNLOADS
# -------------------------------------------
# Recommended job unit:
# one commodity group × one year or generated year loop.

single:
  enabled: true

  jobs:
    - name: "wood_panel_direct"
      params:
        reporterCode:
        partnerCode:
        cmdCode: "WOOD_PANEL"
        flowCode: "FLOW_ALL"

      output_file: "comtrade_{cmdCode}_{period}.csv"
      use_reference_years: false
      fallback_years_start: 2009
      fallback_years_end: 2010

  output:
    directory: "{single_data_dir}"
    quarantine_file: "{quarantine_dir}/quarantine_zero_byte_single.json"
    manifest_file: "{manifest_dir}/download_manifest_single.json"

# -------------------------------------------
# BULK API DOWNLOADS
# -------------------------------------------

bulk:
  enabled: false

  jobs:
    - name: "hs_all_reporters"
      params:
        typeCode: "C"
        freqCode: "A"
        clCode: "HS"
        reporterCode: "all"
        partnerCode: "all"

      # year-range
      years:
        enabled: true
        start: 2021
        end: 2022

      output_file: "Comtrade_bulk_HS_{period}_all_reporters.zip"

  output:
    directory: "{bulk_data_dir}"
    quarantine_file: "{quarantine_dir}/quarantine_zero_byte_bulk.json"
    manifest_file: "{manifest_dir}/download_manifest_bulk.json"


# -------------------------------------------
# LOGGING
# -------------------------------------------

log_level: DEBUG # Options: DEBUG, INFO, WARNING, ERROR, CRITICAL
log_file: "{logs_dir}/LOG_API_PIPELINE.log"



######################### ADVANCED SETTINGS BELOW ##########################################
######################### Only modify if you know what you're doing! #########################

# -------------------------------------------
# RETRY AND RUNTIME
# -------------------------------------------

retry:
  max_attempts: 3
  backoff_seconds: 2.0
  rate_limit:
    max_attempts: 5
    buffer_seconds: 1.0
    fallback_wait_seconds: 60.0

runtime:
  show_progress: true
  timeout_seconds: 300
  overwrite_existing: false
  # What to do when an existing output file fails validation.
  # Valid existing files are always skipped unless overwrite_existing=true.
  existing_file_policy: "redownload" # Options: "skip", "redownload", "fail", 'warn'
  max_workers: 8


# -------------------------------------------
# VALIDATION LIMITS
# -------------------------------------------

validation:
  min_comtrade_year: 1962
  max_future_year_offset: 0
  max_expanded_years_per_job: 200

# -------------------------------------------
# DEFAULT DATA API PARAMETERS
# -------------------------------------------

default_params:
  format: "csv"
  maxRecords: 250000
  includeDesc: true

# -------------------------------------------
# ENDPOINTS
# -------------------------------------------

endpoint:
  single: "https://comtradeapi.un.org/data/v1/get/C/A/HS"
  single_fallbacks:
    - "https://api.uncomtrade.org/data/v1/get/C/A/HS"
  bulk: "https://comtradeapi.un.org/bulk/v1/get/"


# -------------------------------------------
# AUTHENTICATION
# -------------------------------------------

auth:
  enabled: true
  method: "header"
  header_name: "Ocp-Apim-Subscription-Key"
  env_var_name: "COMTRADE_API_KEY"
  query_param_name: "token"
  env_file: ".env"


# -------------------------------------------
# PAGINATION
# -------------------------------------------

pagination:
  enabled: true
  limit_param: "maxRecords"
  offset_param: "offset"
  start_offset: 0



